<!DOCTYPE html>
<html>
<head>
<title>Dropdown Menu</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(purple, indigo);
    height:100vh;
}

/* Navbar */
.nav{
    background: white;
    padding: 15px 30px;
}

.nav ul{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
}

.nav li{
    position: relative;
    padding: 12px 25px;
}

.nav a{
    text-decoration: none;
    color: black;
    font-weight: bold;
}

/* Dropdown */
.dropdown-menu{
    display: none;
    position: absolute;
    top: 45px;
    left: 0;
    background: white;
    width: 180px;
    box-shadow: 0 0 10px gray;
}

.dropdown-menu li{
    padding: 10px;
}

/* Show on hover */
.dropdown:hover .dropdown-menu{
    display: block;
}
</style>

</head>
<body>

<div class="nav">
    <ul>
        <li><a href="#">Home</a></li>

        <li class="dropdown">
            <a href="#">Services ▾</a>
            <ul class="dropdown-menu">
                <li><a href="#">Design</a></li>
                <li><a href="#">Development</a></li>
                <li><a href="#">Accessibility</a></li>
                <li><a href="#">Content Strategy</a></li>
                <li><a href="#">Training</a></li>
            </ul>
        </li>

        <li><a href="#">Portfolio ▾</a></li>
        <li><a href="#">About ▾</a></li>
    </ul>
</div>

</body>
</html>
