<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            margin:0;
            padding:30px;
            text-align:center;
        }

        h1{
            margin-bottom:25px;
        }

        .gallery{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:15px;
        }

        .gallery img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:10px;
            transition:0.3s;
            box-shadow:0 4px 8px rgba(0,0,0,0.2);
        }

        .gallery img:hover{
            transform:scale(1.05);
        }
    </style>
</head>

<body>

<h1>My Image Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/400/300?1">
    <img src="https://picsum.photos/400/300?2">
    <img src="https://picsum.photos/400/300?3">
    <img src="https://picsum.photos/400/300?4">
    <img src="https://picsum.photos/400/300?5">
    <img src="https://picsum.photos/400/300?6">
</div>

</body>
</html>
